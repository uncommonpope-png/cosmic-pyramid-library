<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mystical Library · Pyramid of Souls · Cosmic Realm</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: #ffdd99;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            backdrop-filter: blur(8px);
            pointer-events: none;
            z-index: 10;
            letter-spacing: 1px;
            font-family: monospace;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            color: #ccc;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            z-index: 10;
        }
        @media (max-width: 600px) {
            #info { font-size: 10px; top: 10px; left: 10px; }
            #controls-hint { font-size: 9px; }
        }
    </style>
</head>
<body>
    <div id="info">✨ PYRAMID OF SOULS · COSMIC LIBRARY ✨</div>
    <div id="controls-hint">🖱️ Drag to rotate | Scroll to zoom | Floating souls + galaxies</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // --- setup scene, camera, renderer ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020210);
        scene.fog = new THREE.FogExp2(0x020210, 0.008);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 4, 8);
        camera.lookAt(0, 1.5, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);
        
        // --- postprocessing bloom for glowing souls & pyramid edges ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.3, 0.85);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 0.8;
        bloomPass.radius = 0.5;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // --- controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.zoomSpeed = 1.0;
        controls.rotateSpeed = 0.8;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.panSpeed = 0.8;
        controls.target.set(0, 1.8, 0);
        
        // --- lighting (dramatic, mystical) ---
        const ambient = new THREE.AmbientLight(0x221133, 0.5);
        scene.add(ambient);
        
        const mainLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        mainLight.position.set(3, 8, 2);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0x5577aa, 0.6);
        fillLight.position.set(-2, 3, 3);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0xffaa66, 0.5);
        backLight.position.set(0, 2.5, -4);
        scene.add(backLight);
        
        const rimLight = new THREE.PointLight(0xff88aa, 0.4);
        rimLight.position.set(2, 2, -3);
        scene.add(rimLight);
        
        const pyramidGlow = new THREE.PointLight(0xffaa55, 0.9, 12);
        pyramidGlow.position.set(0, 2, 0);
        scene.add(pyramidGlow);
        
        // --- background: galaxies & planets ---
        // Starfield particle system
        const starCount = 2000;
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 400;
            starPositions[i*3+1] = (Math.random() - 0.5) * 200;
            starPositions[i*3+2] = (Math.random() - 0.5) * 150 - 50;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.15, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        // Nebula / Galaxy sprite (large disc)
        const galaxyTexture = (() => {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width/2, centerY = canvas.height/2;
            for (let i = 0; i < 8000; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.pow(Math.random(), 1.5) * 250;
                const x = centerX + Math.cos(angle) * radius;
                const y = centerY + Math.sin(angle) * radius * 0.4;
                const size = Math.random() * 2 + 0.5;
                const brightness = 80 + Math.random() * 175;
                ctx.fillStyle = `rgba(255, ${150 + Math.random() * 105}, ${80 + Math.random() * 100}, ${Math.random() * 0.6})`;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            return new THREE.CanvasTexture(canvas);
        })();
        const galaxyPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(22, 14),
            new THREE.MeshStandardMaterial({ map: galaxyTexture, transparent: true, opacity: 0.4, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })
        );
        galaxyPlane.position.set(-6, 3, -12);
        galaxyPlane.lookAt(0, 1, 0);
        scene.add(galaxyPlane);
        
        // Planets (spheres with texture)
        const createPlanet = (radius, color, posX, posY, posZ, emissive = 0x332200) => {
            const geometry = new THREE.SphereGeometry(radius, 64, 64);
            const material = new THREE.MeshStandardMaterial({ color, emissive, emissiveIntensity: 0.2, roughness: 0.5, metalness: 0.3 });
            const planet = new THREE.Mesh(geometry, material);
            planet.position.set(posX, posY, posZ);
            scene.add(planet);
            return planet;
        };
        
        const planet1 = createPlanet(0.9, 0x88aaff, -5, 1.2, -9, 0x224466);
        const planet2 = createPlanet(0.7, 0xffaa88, 6, -0.5, -10, 0x663322);
        const planet3 = createPlanet(1.1, 0x99ccff, 4, 2.5, -12, 0x2266aa);
        const planet4 = createPlanet(0.5, 0xffccaa, -4, -1, -11, 0x553322);
        
        // Rings around planet2
        const ringGeo = new THREE.TorusGeometry(1.0, 0.12, 32, 200);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0xddaa77, emissive: 0x552200, emissiveIntensity: 0.3 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2.2;
        ring.position.copy(planet2.position);
        scene.add(ring);
        
        // --- Library environment: bookshelves and pillars ---
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x5a3a2a, roughness: 0.6, metalness: 0.1 });
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x8a7a6a, roughness: 0.7 });
        
        // Pillars
        for (let i = -1; i <= 1; i+=2) {
            const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 4.5, 12), stoneMat);
            pillar.position.set(i * 3.5, 1.8, -3);
            pillar.castShadow = true;
            scene.add(pillar);
        }
        
        // Bookshelves (simple)
        const shelfPositions = [[-4.5, 0.8, -2], [4.2, 0.8, -2], [-4, 2.2, -2.2], [3.8, 2.2, -2.2]];
        shelfPositions.forEach(pos => {
            const shelfBase = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 1.2), woodMat);
            shelfBase.position.set(pos[0], pos[1], pos[2]);
            shelfBase.castShadow = true;
            scene.add(shelfBase);
            // add books (colorful boxes)
            for (let i = 0; i < 5; i++) {
                const book = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.65, 0.3), new THREE.MeshStandardMaterial({ color: [0x8b5a5a, 0x5a6b4a, 0x7a4c6e, 0x9e6a4a][i%4], roughness: 0.3 }));
                book.position.set(pos[0] - 0.8 + i * 0.4, pos[1] + 0.35, pos[2] + 0.1);
                book.castShadow = true;
                scene.add(book);
            }
        });
        
        // --- The Pyramid (detailed texture, emissive edges) ---
        const pyramidGroup = new THREE.Group();
        // Base platform
        const platform = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.3, 4.2), new THREE.MeshStandardMaterial({ color: 0x6a4a3a, roughness: 0.4, metalness: 0.2 }));
        platform.position.set(0, -0.2, 0);
        platform.receiveShadow = true;
        scene.add(platform);
        
        // Pyramid itself (with custom texture)
        const pyramidGeo = new THREE.CylinderGeometry(0, 2.4, 2.8, 4, 1);
        const pyramidTexture = (() => {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#d4b88c';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // hieroglyphic / mystical patterns
            ctx.strokeStyle = '#8b5a2b';
            ctx.lineWidth = 12;
            for (let i = 0; i < 60; i++) {
                ctx.beginPath();
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.moveTo(x, y);
                ctx.lineTo(x + (Math.random() - 0.5) * 40, y + (Math.random() - 0.5) * 40);
                ctx.stroke();
            }
            ctx.fillStyle = '#c9893a';
            ctx.font = 'bold 36px "Times New Roman"';
            for (let i = 0; i < 12; i++) {
                ctx.fillText("𓃥𓃠𓂀", Math.random() * canvas.width, Math.random() * canvas.height);
            }
            // gold veining
            ctx.fillStyle = '#e4b03b';
            for (let i = 0; i < 300; i++) {
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 4, 4);
            }
            return new THREE.CanvasTexture(canvas);
        })();
        
        const pyramidMat = new THREE.MeshStandardMaterial({ map: pyramidTexture, color: 0xccaa77, roughness: 0.3, metalness: 0.7, emissive: 0x442200, emissiveIntensity: 0.2 });
        const pyramid = new THREE.Mesh(pyramidGeo, pyramidMat);
        pyramid.castShadow = true;
        pyramid.receiveShadow = true;
        pyramid.position.set(0, 1.2, 0);
        scene.add(pyramid);
        
        // Gold capstone
        const capstone = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.6, 8), new THREE.MeshStandardMaterial({ color: 0xffcc66, metalness: 0.9, emissive: 0xaa6622, emissiveIntensity: 0.5 }));
        capstone.position.set(0, 2.65, 0);
        capstone.castShadow = true;
        scene.add(capstone);
        
        // Add glowing edges using EdgesGeometry + emissive lines
        const edgesGeo = new THREE.EdgesGeometry(pyramidGeo);
        const edgesMat = new THREE.LineBasicMaterial({ color: 0xffaa55 });
        const wireframe = new THREE.LineSegments(edgesGeo, edgesMat);
        wireframe.position.copy(pyramid.position);
        scene.add(wireframe);
        
        // --- Floating Souls: ethereal, translucent, with trails ---
        // Study reference: souls look like translucent, glowing humanoid shapes or orbs with wispy trails.
        // We'll create a set of floating "soul orbs" with soft particle tails.
        const soulCount = 35;
        const souls = [];
        
        // Helper: create a soul (glowing sphere with a wispy particle ring)
        function createSoul(x, y, z, color = 0xffaa88, size = 0.22) {
            const group = new THREE.Group();
            // core glow
            const coreMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.9, transparent: true, opacity: 0.85 });
            const core = new THREE.Mesh(new THREE.SphereGeometry(size, 24, 24), coreMat);
            core.castShadow = false;
            group.add(core);
            
            // aura (larger semi-transparent)
            const auraMat = new THREE.MeshPhongMaterial({ color: color, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending });
            const aura = new THREE.Mesh(new THREE.SphereGeometry(size * 1.6, 24, 24), auraMat);
            group.add(aura);
            
            // wispy trail particles (floating around)
            const trailCount = 12;
            const trailParticles = [];
            for (let i = 0; i < trailCount; i++) {
                const trailMat = new THREE.PointsMaterial({ color: color, size: 0.05, transparent: true, blending: THREE.AdditiveBlending });
                const particleGeo = new THREE.BufferGeometry();
                const pos = new Float32Array(1 * 3);
                pos[0] = (Math.random() - 0.5) * 0.5;
                pos[1] = (Math.random() - 0.5) * 0.5;
                pos[2] = (Math.random() - 0.5) * 0.5;
                particleGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const points = new THREE.Points(particleGeo, trailMat);
                group.add(points);
                trailParticles.push({ points, offset: new THREE.Vector3(pos[0], pos[1], pos[2]), speed: 0.01 + Math.random() * 0.02 });
            }
            group.userData = { trailParticles, baseColor: color, floatSpeed: 0.5 + Math.random() * 0.5, floatAngle: Math.random() * Math.PI * 2, radius: 0.8 };
            group.position.set(x, y, z);
            scene.add(group);
            return group;
        }
        
        // create souls floating around pyramid and library
        const soulColors = [0xffaa88, 0xff88aa, 0xaaffcc, 0xffccaa, 0xdd99ff];
        for (let i = 0; i < soulCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = 2.5 + Math.random() * 3.5;
            const yOffset = 0.5 + Math.random() * 3.2;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const color = soulColors[Math.floor(Math.random() * soulColors.length)];
            const soul = createSoul(x, yOffset, z, color, 0.2 + Math.random() * 0.1);
            souls.push({ obj: soul, angle: angle, radius: radius, ySpeed: 0.2 + Math.random() * 0.4, yPhase: Math.random() * Math.PI * 2, initialY: yOffset });
        }
        
        // Additional wisps of light (particle system for ethereal feel)
        const wispCount = 800;
        const wispGeo = new THREE.BufferGeometry();
        const wispPositions = new Float32Array(wispCount * 3);
        for (let i = 0; i < wispCount; i++) {
            wispPositions[i*3] = (Math.random() - 0.5) * 12;
            wispPositions[i*3+1] = Math.random() * 5;
            wispPositions[i*3+2] = (Math.random() - 0.5) * 12 - 2;
        }
        wispGeo.setAttribute('position', new THREE.BufferAttribute(wispPositions, 3));
        const wispMat = new THREE.PointsMaterial({ color: 0xffaa88, size: 0.04, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
        const wisps = new THREE.Points(wispGeo, wispMat);
        scene.add(wisps);
        
        // --- Additional magic dust around pyramid ---
        const dustCount = 1500;
        const dustGeo = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustCount; i++) {
            dustPositions[i*3] = (Math.random() - 0.5) * 5;
            dustPositions[i*3+1] = Math.random() * 3.5;
            dustPositions[i*3+2] = (Math.random() - 0.5) * 5;
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        const dustMat = new THREE.PointsMaterial({ color: 0xffcc88, size: 0.03, transparent: true, blending: THREE.AdditiveBlending });
        const dustParticles = new THREE.Points(dustGeo, dustMat);
        dustParticles.position.set(0, 1.2, 0);
        scene.add(dustParticles);
        
        // --- Animate souls: floating movement and wispy trails rotation ---
        let time = 0;
        
        function animateSouls() {
            time += 0.016;
            souls.forEach(soul => {
                // orbital motion around pyramid
                const newAngle = soul.angle + 0.008;
                soul.angle = newAngle;
                const rad = soul.radius;
                const x = Math.cos(newAngle) * rad;
                const z = Math.sin(newAngle) * rad;
                // bobbing Y
                const y = soul.initialY + Math.sin(time * soul.ySpeed + soul.yPhase) * 0.2;
                soul.obj.position.set(x, y, z);
                // rotate aura particles
                if (soul.obj.userData.trailParticles) {
                    soul.obj.userData.trailParticles.forEach((part, idx) => {
                        part.points.rotation.y += 0.03;
                        part.points.rotation.x += 0.02;
                    });
                }
                // slight scale pulse
                const scale = 1 + Math.sin(time * 3 + soul.angle) * 0.1;
                soul.obj.children[0].scale.set(scale, scale, scale);
            });
            
            // rotate starfield and wisps slowly
            stars.rotation.y += 0.0005;
            stars.rotation.x += 0.0003;
            wisps.rotation.y += 0.002;
            dustParticles.rotation.y += 0.005;
            
            // animate planets rotation
            planet1.rotation.y += 0.005;
            planet2.rotation.x += 0.003;
            planet3.rotation.z += 0.004;
            ring.rotation.z += 0.01;
            ring.rotation.y += 0.005;
            
            // pulsating pyramid glow
            const intensity = 0.8 + Math.sin(time * 2) * 0.3;
            pyramidGlow.intensity = intensity;
            capstone.material.emissiveIntensity = 0.4 + Math.sin(time * 2.5) * 0.2;
        }
        
        // --- Add floating books / magical pages around library ---
        const floatingPages = [];
        for (let i = 0; i < 40; i++) {
            const pageMat = new THREE.MeshStandardMaterial({ color: 0xfae8c8, emissive: 0xaa8844, emissiveIntensity: 0.1 });
            const page = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.28, 0.02), pageMat);
            page.position.set((Math.random() - 0.5) * 8, Math.random() * 3.5, (Math.random() - 0.5) * 7 - 1);
            page.castShadow = true;
            scene.add(page);
            floatingPages.push({ mesh: page, speedX: (Math.random() - 0.5) * 0.01, speedY: (Math.random() - 0.5) * 0.01 + 0.005, speedZ: (Math.random() - 0.5) * 0.01, origPos: page.position.clone() });
        }
        
        function animatePages() {
            floatingPages.forEach(p => {
                p.mesh.position.x += p.speedX;
                p.mesh.position.y += Math.sin(time * 1.5) * 0.003;
                p.mesh.position.z += p.speedZ;
                p.mesh.rotation.z += 0.02;
                p.mesh.rotation.x += 0.01;
                // reset bounds
                if (Math.abs(p.mesh.position.x) > 5) p.mesh.position.x = p.origPos.x * -0.8;
                if (p.mesh.position.y > 3.5) p.mesh.position.y = 0.2;
                if (Math.abs(p.mesh.position.z) > 6) p.mesh.position.z = p.origPos.z;
            });
        }
        
        // --- Lens flare / glow effect simulation via point lights & bloom ---
        // additional floating orbs
        const orbCount = 12;
        const orbs = [];
        for (let i = 0; i < orbCount; i++) {
            const orbMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0xff4422, emissiveIntensity: 0.7, transparent: true });
            const orb = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), orbMat);
            orb.position.set((Math.random() - 0.5) * 7, Math.random() * 4, (Math.random() - 0.5) * 6 - 1);
            scene.add(orb);
            orbs.push(orb);
        }
        
        // --- camera slight auto orbit optional? not needed, but add dynamic ---
        
        // --- animation loop ---
        let lastTime = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(0.033, performance.now() - lastTime) / 1000;
            lastTime = performance.now();
            
            animateSouls();
            animatePages();
            
            // move orbs in gentle circles
            orbs.forEach((orb, idx) => {
                orb.position.x += Math.sin(time * 0.8 + idx) * 0.003;
                orb.position.y += Math.cos(time * 0.6 + idx) * 0.002;
                orb.position.z += Math.sin(time * 0.5 + idx) * 0.003;
            });
            
            // bloom strength subtle variation
            bloomPass.strength = 0.75 + Math.sin(time * 0.5) * 0.1;
            
            controls.update(); // update orbit controls
            effectComposer.render();
        }
        
        animate();
        
        // window resize handler
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effectComposer.setSize(window.innerWidth, window.innerHeight);
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        console.log("Mystical Library with Pyramid, Floating Souls, Planets & Galaxies loaded.");
    </script>
</body>
</html>
