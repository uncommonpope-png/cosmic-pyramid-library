<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Test</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #222; }
        #status { position: fixed; top: 10px; left: 10px; color: #0f0; font-family: monospace; font-size: 14px; z-index: 999; background: #000; padding: 6px 12px; }
    </style>
</head>
<body>
    <div id="status">Loading...</div>
    <script src="three/three.min.js"></script>
    <script>
document.getElementById('status').textContent = 'three.js: ' + (typeof THREE !== 'undefined' ? 'YES' : 'NO');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x4488ff);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 3;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
document.getElementById('status').textContent = 'Renderer created';
const geo = new THREE.BoxGeometry(1, 1, 1);
const mat = new THREE.MeshBasicMaterial({ color: 0xff2244 });
const cube = new THREE.Mesh(geo, mat);
scene.add(cube);
document.getElementById('status').textContent = 'Cube added';
function animate() {
    requestAnimationFrame(animate);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.01;
    renderer.render(scene, camera);
}
animate();
document.getElementById('status').textContent = 'Animating';
    </script>
</body>
</html>
