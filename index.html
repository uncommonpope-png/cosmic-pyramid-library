<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌀 Cosmic Pyramid Library – Phase 1</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Cinema', 'Orbitron', 'Courier New', monospace; }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,235,180,0.9);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
            font-family: monospace;
        }
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255,200,100,0.8);
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 10px;
            pointer-events: none;
            font-family: monospace;
        }
        .instruction {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 10px;
            color: #ffaa66;
            font-family: monospace;
            pointer-events: none;
        }
        @media (max-width: 768px) {
            #info, #controls, .instruction { font-size: 8px; padding: 4px 8px; }
        }
    </style>
</head>
<body>
    <div id="info">🌀 COSMIC PYRAMID LIBRARY – Phase 1 | Galaxy Scaffold</div>
    <div id="controls">🖱️ Drag to orbit | Scroll to zoom</div>
    <div class="instruction">📚 Click any book – future: read, add to cart, fly</div>

    <!-- Import Three.js core + add-ons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
        // ============================================================
        // PHASE 1: COSMIC STAGE – Pyramid, Galaxy, Floating Shelves
        // ============================================================
        
        // --- Setup Scene, Camera, Renderer ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010118);
        scene.fog = new THREE.FogExp2(0x010118, 0.0008);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 4, 12);
        camera.lookAt(0, 0, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);
        
        // --- Post-processing (Bloom for glow) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.3, 0.85);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 0.8;
        bloomPass.radius = 0.5;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // --- Controls (cinematic orbit) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;
        controls.enableZoom = true;
        controls.zoomSpeed = 1.0;
        controls.enablePan = false;
        controls.target.set(0, 2, 0);
        controls.maxPolarAngle = Math.PI / 2.2;
        
        // --- Lighting System ---
        // Ambient
        const ambientLight = new THREE.AmbientLight(0x332244, 0.5);
        scene.add(ambientLight);
        // Directional main light (sun)
        const sunLight = new THREE.DirectionalLight(0xffcc88, 1.2);
        sunLight.position.set(5, 10, 3);
        sunLight.castShadow = true;
        sunLight.receiveShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        scene.add(sunLight);
        // Fill light from below (dramatic)
        const fillLight = new THREE.PointLight(0x8866ff, 0.6);
        fillLight.position.set(0, -2, 0);
        scene.add(fillLight);
        // Back rim light
        const rimLight = new THREE.PointLight(0xffaa66, 0.5);
        rimLight.position.set(0, 3, -5);
        scene.add(rimLight);
        // Floating orbs light
        const floatingLights = [];
        for (let i = 0; i < 8; i++) {
            const light = new THREE.PointLight(0xffaa66, 0.4);
            light.castShadow = false;
            scene.add(light);
            floatingLights.push(light);
        }
        
        // --- Galaxy Background (Starfield + Nebula via CubeTexture or particle system) ---
        // Star particle system
        const starCount = 3000;
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 800;
            starPositions[i*3+1] = (Math.random() - 0.5) * 400;
            starPositions[i*3+2] = (Math.random() - 0.5) * 300 - 100;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.7 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);
        
        // Nebula effect – large soft particles
        const nebulaCount = 800;
        const nebulaGeometry = new THREE.BufferGeometry();
        const nebulaPositions = new Float32Array(nebulaCount * 3);
        const nebulaColors = [];
        for (let i = 0; i < nebulaCount; i++) {
            nebulaPositions[i*3] = (Math.random() - 0.5) * 200;
            nebulaPositions[i*3+1] = (Math.random() - 0.5) * 100;
            nebulaPositions[i*3+2] = (Math.random() - 0.5) * 150 - 50;
            const color = new THREE.Color().setHSL(0.6 + Math.random() * 0.2, 0.8, 0.5);
            nebulaColors.push(color.r, color.g, color.b);
        }
        nebulaGeometry.setAttribute('position', new THREE.BufferAttribute(nebulaPositions, 3));
        nebulaGeometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(nebulaColors), 3));
        const nebulaMaterial = new THREE.PointsMaterial({ size: 0.4, vertexColors: true, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending });
        const nebulae = new THREE.Points(nebulaGeometry, nebulaMaterial);
        scene.add(nebulae);
        
        // --- The Pyramid (Central Structure) ---
        // Step pyramid with glowing edges
        const pyramidGroup = new THREE.Group();
        const tiers = [
            { width: 3.2, height: 0.6, y: 0.3, color: 0xccaa77 },
            { width: 2.6, height: 0.6, y: 0.9, color: 0xddbb88 },
            { width: 2.0, height: 0.6, y: 1.5, color: 0xeecc99 },
            { width: 1.4, height: 0.6, y: 2.1, color: 0xffddaa }
        ];
        tiers.forEach(tier => {
            const boxGeo = new THREE.BoxGeometry(tier.width, tier.height, tier.width);
            const material = new THREE.MeshStandardMaterial({ color: tier.color, metalness: 0.7, roughness: 0.3, emissive: 0x442200 });
            const box = new THREE.Mesh(boxGeo, material);
            box.position.y = tier.y;
            box.castShadow = true;
            box.receiveShadow = true;
            pyramidGroup.add(box);
            
            // Edge glow lines
            const edgesGeo = new THREE.EdgesGeometry(boxGeo);
            const edgesMat = new THREE.LineBasicMaterial({ color: 0xffaa66 });
            const wireframe = new THREE.LineSegments(edgesGeo, edgesMat);
            wireframe.position.copy(box.position);
            pyramidGroup.add(wireframe);
        });
        // Top crystal
        const crystalGeo = new THREE.ConeGeometry(0.5, 0.8, 8);
        const crystalMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0xff4422, emissiveIntensity: 0.6 });
        const crystal = new THREE.Mesh(crystalGeo, crystalMat);
        crystal.position.y = 2.5;
        crystal.castShadow = true;
        pyramidGroup.add(crystal);
        scene.add(pyramidGroup);
        
        // --- Floating Shelves (Ring platforms around pyramid) ---
        const shelfGroup = new THREE.Group();
        const shelfRadius = 3.8;
        const shelfCount = 4;
        const shelfColors = [0x88aaff, 0xff88aa, 0x88ffaa, 0xffaa88];
        
        // Store book objects for interaction
        const books = [];
        
        for (let i = 0; i < shelfCount; i++) {
            const angleOffset = (i / shelfCount) * Math.PI * 2;
            const yPos = 0.5 + i * 0.8;
            
            // Create a circular platform
            const platformGeo = new THREE.TorusGeometry(shelfRadius, 0.15, 32, 100);
            const platformMat = new THREE.MeshStandardMaterial({ color: shelfColors[i], metalness: 0.8, roughness: 0.2 });
            const ring = new THREE.Mesh(platformGeo, platformMat);
            ring.rotation.x = Math.PI / 2;
            ring.position.y = yPos;
            ring.castShadow = true;
            shelfGroup.add(ring);
            
            // Add books on this shelf
            const bookCount = 8;
            for (let j = 0; j < bookCount; j++) {
                const angle = angleOffset + (j / bookCount) * Math.PI * 2;
                const rad = shelfRadius - 0.2;
                const x = Math.cos(angle) * rad;
                const z = Math.sin(angle) * rad;
                
                // Book geometry (colorful)
                const colors = [0xff6666, 0x66ff66, 0x6666ff, 0xffaa66, 0xff66aa, 0x66ffaa];
                const bookColor = colors[(i * bookCount + j) % colors.length];
                const bookMat = new THREE.MeshStandardMaterial({ color: bookColor, metalness: 0.2, roughness: 0.4, emissive: 0x221100 });
                const bookGeo = new THREE.BoxGeometry(0.5, 0.7, 0.2);
                const book = new THREE.Mesh(bookGeo, bookMat);
                book.position.set(x, yPos + 0.05, z);
                book.rotation.y = angle;
                book.castShadow = true;
                book.userData = {
                    title: `Cosmic Volume ${i * bookCount + j + 1}`,
                    price: 19.99,
                    description: "A mystical book floating in the galaxy. Click to explore."
                };
                shelfGroup.add(book);
                books.push(book);
                
                // Add a tiny spine glow
                const spineMat = new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0x442200 });
                const spineGeo = new THREE.BoxGeometry(0.05, 0.6, 0.05);
                const spine = new THREE.Mesh(spineGeo, spineMat);
                spine.position.set(0.28, 0, 0);
                book.add(spine);
            }
        }
        scene.add(shelfGroup);
        
        // --- Floating particles around pyramid (magic dust) ---
        const dustCount = 2000;
        const dustGeometry = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustCount; i++) {
            dustPositions[i*3] = (Math.random() - 0.5) * 10;
            dustPositions[i*3+1] = Math.random() * 5;
            dustPositions[i*3+2] = (Math.random() - 0.5) * 10;
        }
        dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        const dustMat = new THREE.PointsMaterial({ color: 0xffaa88, size: 0.05, transparent: true, blending: THREE.AdditiveBlending });
        const dustParticles = new THREE.Points(dustGeometry, dustMat);
        scene.add(dustParticles);
        
        // --- Ambient galaxy effect: a huge sphere with star texture? optional---
        // Add a faint glow sphere around the scene
        const glowMat = new THREE.MeshBasicMaterial({ color: 0x88aaff, transparent: true, opacity: 0.03, side: THREE.BackSide });
        const glowSphere = new THREE.Mesh(new THREE.SphereGeometry(12, 32, 32), glowMat);
        scene.add(glowSphere);
        
        // --- Animation Loop & interactive click handling ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        function onMouseClick(event) {
            // Calculate mouse position in normalized coordinates
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(books);
            
            if (intersects.length > 0) {
                const clickedBook = intersects[0].object;
                const bookData = clickedBook.userData;
                alert(`📖 ${bookData.title}\n💰 $${bookData.price}\n✨ ${bookData.description}\n\n(Phase 2: Add to cart, read, fly)`);
                // Visual feedback
                clickedBook.material.emissiveIntensity = 0.8;
                setTimeout(() => {
                    clickedBook.material.emissiveIntensity = 0;
                }, 200);
            }
        }
        
        window.addEventListener('click', onMouseClick, false);
        
        // Animate floating lights
        let time = 0;
        function animateFloatingLights() {
            time += 0.016;
            for (let i = 0; i < floatingLights.length; i++) {
                const angle = time * 0.5 + i;
                const rad = 4.5;
                const x = Math.cos(angle) * rad;
                const z = Math.sin(angle) * rad;
                floatingLights[i].position.set(x, 1.2 + Math.sin(angle * 1.3) * 1.5, z);
                floatingLights[i].intensity = 0.4 + Math.sin(time * 2 + i) * 0.2;
            }
        }
        
        // Rotate stars slowly
        function animateStars() {
            stars.rotation.y += 0.0002;
            stars.rotation.x += 0.0001;
            nebulae.rotation.y -= 0.0001;
        }
        
        // Main loop
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            animateFloatingLights();
            animateStars();
            
            // Gentle rotation of shelves? optional
            shelfGroup.rotation.y += 0.001;
            
            // Update controls and composer
            controls.update();
            effectComposer.render();
        }
        
        animate();
        
        // Resize handler
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            effectComposer.setSize(window.innerWidth, window.innerHeight);
        }
        
        console.log('🌀 Cosmic Pyramid Library – Phase 1 Active');
    </script>
</body>
</html>
