<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌀 Cosmic Pyramid Library – Phase 4 | E‑commerce & My Books</title>
    <style>
        body { margin:0; overflow:hidden; font-family:'Cinema', 'Orbitron', 'Courier New', monospace; }
        canvas { display:block; width:100%; height:100%; }
        /* UI Overlay */
        .ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }
        .chat-panel, .cart-panel, .mybooks-panel {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid #ffaa66;
            width: 280px;
            pointer-events: auto;
            padding: 12px;
            color: #ffdd99;
            font-size: 12px;
            font-family: monospace;
        }
        .cart-panel { position: absolute; top: 80px; right: 20px; bottom: auto; left: auto; width: 260px; }
        .mybooks-panel { position: absolute; top: 80px; left: 20px; width: 260px; }
        .chat-log { height: 150px; overflow-y: auto; margin-bottom: 8px; border-bottom: 1px solid #ffaa66; }
        .chat-input-area { display: flex; gap: 6px; }
        input, button {
            background: #2a2a3a;
            border: 1px solid #ffaa66;
            color: #ffaa66;
            border-radius: 20px;
            padding: 6px 10px;
            font-family: monospace;
        }
        button { cursor: pointer; background: #ffaa66; color: #000; font-weight: bold; }
        .book-item { padding: 5px; margin: 5px 0; background: rgba(0,0,0,0.5); border-radius: 12px; cursor: pointer; }
        .librarian-avatar { position: absolute; bottom: 20px; right: 20px; width: 80px; height: 80px; background: rgba(0,0,0,0.6); border-radius: 50%; border: 2px solid #ffaa66; display: flex; align-items: center; justify-content: center; font-size: 40px; pointer-events: none; z-index: 20; }
        .flying-book-ui { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); border-radius: 40px; padding: 8px 20px; color: #ffaa66; display: none; z-index: 30; white-space: nowrap; }
        .page-flip { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 320px; max-height: 80vh; background: rgba(0,0,0,0.95); border-radius: 20px; border: 1px solid #ffaa66; display: none; z-index: 100; flex-direction: column; padding: 20px; color: #ffdd99; overflow-y: auto; }
        @media (max-width: 768px) {
            .chat-panel, .cart-panel, .mybooks-panel { width: 240px; font-size: 10px; }
            .librarian-avatar { width: 60px; height: 60px; font-size: 30px; }
        }
    </style>
</head>
<body>
    <div id="dbg" style="position:fixed;top:0;left:0;z-index:99999;color:#0f0;background:rgba(0,0,0,0.95);padding:8px;font:12px monospace;white-space:pre-wrap;max-height:120px;overflow:auto;pointer-events:none;"></div>
    <script>
        function dbg(m){var e=document.getElementById('dbg');if(e)e.textContent+=m+'\n';}
        window.onerror=function(m,u,l,c,err){dbg('ERR: '+m+' '+l+':'+c);};
        window.addEventListener('unhandledrejection',function(e){dbg('PROM: '+e.reason);});
        dbg('Page loaded');
    </script>

    <!-- UI Panels -->
    <div class="ui">
        <div class="chat-panel">
            <div class="chat-log" id="chatLog"><div>📚 Librarian: Welcome, seeker. Browse the stars or your collection.</div></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Ask the librarian...">
                <button id="sendChat">Send</button>
                <button id="voiceBtn">🎤</button>
            </div>
        </div>
        <div class="mybooks-panel" id="myBooksPanel">
            <strong>📖 My Books</strong>
            <div id="myBooksList">(Login to see your collection)</div>
            <button id="loginBtn" style="margin-top:8px;">🔐 Login / Signup</button>
        </div>
        <div class="cart-panel" id="cartPanel">
            <strong>🛒 Cart</strong>
            <div id="cartItems">Empty</div>
            <button id="checkoutBtn" style="margin-top:8px;">💳 Checkout</button>
        </div>
    </div>
    <div class="librarian-avatar">🧙</div>
    <div class="flying-book-ui" id="flyingBookUI">✨ Flying through the galaxy... ✨</div>
    <div id="pageFlipModal" class="page-flip">
        <div id="bookTitle" style="font-size: 20px; margin-bottom: 10px;"></div>
        <div id="bookContent" style="flex:1; overflow-y:auto; margin:10px 0;"></div>
        <button id="closePageFlip">Close</button>
        <button id="buyNowBtn" style="margin-top:10px;">📦 Add to Cart & Fly</button>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }
    </script>

    <script type="module">
        dbg('Module script started');
        import * as THREE from 'three';
        dbg('THREE imported');
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        dbg('OrbitControls imported');
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        dbg('EffectComposer imported');
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        dbg('RenderPass imported');
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        dbg('All imports done');
        
        // ============================================================
        // PHASE 4: E‑COMMERCE + USER PERSISTENCE (demo with localStorage)
        // ============================================================
        
        // --- Shopify Integration Guide (replace with real SDK later) ---
        // For production, replace the addToCart and checkout functions with Shopify Buy SDK.
        // This demo uses localStorage to simulate user library and cart.
        
        let currentUser = localStorage.getItem('soulverse_user') || null;
        let userLibrary = JSON.parse(localStorage.getItem(`library_${currentUser}`) || '[]');
        let cart = JSON.parse(localStorage.getItem('soulverse_cart') || '[]');
        
        // --- 3D Scene Setup (reused from Phase 3, simplified) ---
        dbg('Creating scene...');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010118);
        scene.fog = new THREE.FogExp2(0x010118, 0.0008);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(5, 4, 12);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        dbg('Renderer: ' + (renderer ? 'OK' : 'NULL'));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        dbg('Canvas appended: ' + (document.body.contains(renderer.domElement)));
        
        dbg('Creating composer...');
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.3, 0.85);
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);
        dbg('Composer OK');
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;
        controls.target.set(0, 2, 0);
        dbg('Controls OK');
        
        // Lighting (quick)
        const ambient = new THREE.AmbientLight(0x332244, 0.5);
        scene.add(ambient);
        const sunLight = new THREE.DirectionalLight(0xffcc88, 1.2);
        sunLight.position.set(5, 10, 3);
        sunLight.castShadow = true;
        scene.add(sunLight);
        const fillLight = new THREE.PointLight(0x8866ff, 0.6);
        fillLight.position.set(0, -2, 0);
        scene.add(fillLight);
        
        // Stars
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(3000 * 3);
        for (let i = 0; i < 3000; i++) {
            starPos[i*3] = (Math.random() - 0.5) * 800;
            starPos[i*3+1] = (Math.random() - 0.5) * 400;
            starPos[i*3+2] = (Math.random() - 0.5) * 300 - 100;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.2 }));
        scene.add(stars);
        
        // Pyramid (simplified)
        const pyramidGroup = new THREE.Group();
        const tiers = [[3.2,0.6,0.3,0xccaa77],[2.6,0.6,0.9,0xddbb88],[2.0,0.6,1.5,0xeecc99],[1.4,0.6,2.1,0xffddaa]];
        tiers.forEach(t => {
            const box = new THREE.Mesh(new THREE.BoxGeometry(t[0], t[1], t[0]), new THREE.MeshStandardMaterial({ color: t[3], metalness: 0.7 }));
            box.position.y = t[2];
            box.castShadow = true;
            pyramidGroup.add(box);
        });
        const crystal = new THREE.Mesh(new THREE.ConeGeometry(0.5,0.8,8), new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0xff4422 }));
        crystal.position.y = 2.5;
        pyramidGroup.add(crystal);
        scene.add(pyramidGroup);
        
        // Floating shelves with books (store in array)
        const shelfGroup = new THREE.Group();
        const shelfRadius = 3.8;
        const books = [];
        const bookDataMap = new Map(); // map 3D book object to data
        
        for (let i = 0; i < 4; i++) {
            const yPos = 0.5 + i * 0.8;
            const ring = new THREE.Mesh(new THREE.TorusGeometry(shelfRadius, 0.15, 32, 100), new THREE.MeshStandardMaterial({ color: [0x88aaff,0xff88aa,0x88ffaa,0xffaa88][i], metalness: 0.8 }));
            ring.rotation.x = Math.PI/2;
            ring.position.y = yPos;
            shelfGroup.add(ring);
            for (let j = 0; j < 8; j++) {
                const angle = (j / 8) * Math.PI * 2;
                const x = Math.cos(angle) * (shelfRadius - 0.2);
                const z = Math.sin(angle) * (shelfRadius - 0.2);
                const colors = [0xff6666,0x66ff66,0x6666ff,0xffaa66,0xff66aa,0x66ffaa];
                const bookColor = colors[(i*8+j) % colors.length];
                const book = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.7,0.2), new THREE.MeshStandardMaterial({ color: bookColor, metalness: 0.2 }));
                book.position.set(x, yPos+0.05, z);
                book.rotation.y = angle;
                book.castShadow = true;
                const bookId = `book_${i}_${j}`;
                const bookData = {
                    id: bookId,
                    title: `Cosmic Volume ${i*8+j+1}`,
                    price: (19.99 + i*5).toFixed(2),
                    description: "A mystical book floating in the galaxy.",
                    content: `This is the content of ${i*8+j+1}. Contains ancient wisdom.`
                };
                book.userData = bookData;
                shelfGroup.add(book);
                books.push(book);
                bookDataMap.set(book, bookData);
            }
        }
        scene.add(shelfGroup);
        
        // Dust particles
        const dustGeo = new THREE.BufferGeometry();
        const dustPos = new Float32Array(2000 * 3);
        for (let i=0;i<2000;i++) {
            dustPos[i*3] = (Math.random()-0.5)*10;
            dustPos[i*3+1] = Math.random()*5;
            dustPos[i*3+2] = (Math.random()-0.5)*10;
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xffaa88, size: 0.05, blending: THREE.AdditiveBlending }));
        scene.add(dust);
        
        // --- Helper Functions ---
        function updateCartUI() {
            const cartDiv = document.getElementById('cartItems');
            if (cart.length === 0) cartDiv.innerHTML = "Empty";
            else cartDiv.innerHTML = cart.map(item => `<div>${item.title} - $${item.price}</div>`).join('');
        }
        function updateLibraryUI() {
            const container = document.getElementById('myBooksList');
            if (!currentUser) { container.innerHTML = "(Login to see your collection)"; return; }
            if (userLibrary.length === 0) container.innerHTML = "No books yet. Buy one!";
            else container.innerHTML = userLibrary.map(book => `<div class="book-item" data-id="${book.id}">📖 ${book.title}</div>`).join('');
            // attach click to read owned books
            document.querySelectorAll('.book-item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = el.dataset.id;
                    const book = userLibrary.find(b => b.id === id);
                    if (book) openBookModal(book, false);
                });
            });
        }
        
        function addToCart(bookData) {
            cart.push(bookData);
            localStorage.setItem('soulverse_cart', JSON.stringify(cart));
            updateCartUI();
            alert(`Added ${bookData.title} to cart.`);
        }
        
        function buyBook(bookData) {
            if (!currentUser) { alert("Please login first."); return; }
            addToCart(bookData);
            // Simulate purchase and add to library
            if (!userLibrary.find(b => b.id === bookData.id)) {
                userLibrary.push(bookData);
                localStorage.setItem(`library_${currentUser}`, JSON.stringify(userLibrary));
                updateLibraryUI();
            }
            // Optionally start flying animation
            startFlyingBook(bookData);
        }
        
        // Flying book animation (simplified)
        let isFlying = false;
        let flyingBookMesh = null;
        function startFlyingBook(bookData) {
            if (isFlying) return;
            isFlying = true;
            const flyingUI = document.getElementById('flyingBookUI');
            flyingUI.style.display = 'block';
            const group = new THREE.Group();
            const cover = new THREE.Mesh(new THREE.BoxGeometry(0.8,1.0,0.15), new THREE.MeshStandardMaterial({ color: 0xffaa66 }));
            group.add(cover);
            group.position.set(0,1.5,0);
            scene.add(group);
            flyingBookMesh = group;
            let startTime = performance.now();
            function animateFly(now) {
                const t = Math.min(1, (now - startTime) / 3000);
                const angle = t * Math.PI * 4;
                const rad = 4 + t * 8;
                const x = Math.cos(angle) * rad;
                const z = Math.sin(angle) * rad;
                const y = 1.5 + t * 3;
                if (flyingBookMesh) flyingBookMesh.position.set(x, y, z);
                if (t < 1) requestAnimationFrame(animateFly);
                else {
                    scene.remove(group);
                    flyingBookMesh = null;
                    flyingUI.style.display = 'none';
                    isFlying = false;
                    openBookModal(bookData, true);
                }
            }
            requestAnimationFrame(animateFly);
        }
        
        function openBookModal(bookData, isOwned = false) {
            const modal = document.getElementById('pageFlipModal');
            document.getElementById('bookTitle').innerText = bookData.title;
            document.getElementById('bookContent').innerHTML = `<p>${bookData.content}</p><p>Price: $${bookData.price}</p>`;
            const buyBtn = document.getElementById('buyNowBtn');
            if (isOwned) {
                buyBtn.innerText = '📖 Read Again';
                buyBtn.onclick = () => { alert(`Reading ${bookData.title}...`); };
            } else {
                buyBtn.innerText = '📦 Add to Cart & Fly';
                buyBtn.onclick = () => buyBook(bookData);
            }
            modal.style.display = 'flex';
        }
        
        // Book click handler
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(books);
            if (intersects.length > 0) {
                const book = intersects[0].object;
                const data = book.userData;
                openBookModal(data, false);
            }
        });
        
        // Auth simulation
        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = prompt("Enter email to login/signup:");
            if (email) {
                currentUser = email;
                localStorage.setItem('soulverse_user', currentUser);
                userLibrary = JSON.parse(localStorage.getItem(`library_${currentUser}`) || '[]');
                updateLibraryUI();
                alert(`Logged in as ${currentUser}`);
            }
        });
        
        document.getElementById('checkoutBtn').addEventListener('click', () => {
            if (cart.length === 0) { alert("Cart empty"); return; }
            // In production, redirect to Shopify checkout
            alert("Proceed to checkout (simulated). In production, redirect to Shopify cart.");
            // For demo, clear cart
            cart = [];
            localStorage.setItem('soulverse_cart', JSON.stringify(cart));
            updateCartUI();
        });
        
        document.getElementById('closePageFlip').addEventListener('click', () => {
            document.getElementById('pageFlipModal').style.display = 'none';
        });
        
        // Librarian chat (simple)
        const chatLog = document.getElementById('chatLog');
        const chatInput = document.getElementById('chatInput');
        function addChat(msg, fromUser = false) {
            const div = document.createElement('div');
            div.innerHTML = `<strong>${fromUser ? 'You' : '📚 Librarian'}:</strong> ${msg}`;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            addChat(text, true);
            chatInput.value = "";
            let reply = "I am the Soul Librarian. Click any book to read or buy.";
            if (text.toLowerCase().includes('recommend')) {
                const randomBook = books[Math.floor(Math.random() * books.length)].userData;
                reply = `I recommend "${randomBook.title}". Would you like to see it?`;
            } else if (text.toLowerCase().includes('price')) {
                reply = "Prices range from $19.99 to $39.99 per cosmic volume.";
            }
            addChat(reply);
        }
        document.getElementById('sendChat').addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        
        // Voice
        if ('webkitSpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            document.getElementById('voiceBtn').addEventListener('click', () => {
                recognition.start();
            });
            recognition.onresult = (e) => {
                chatInput.value = e.results[0][0].transcript;
                sendMessage();
            };
        } else {
            document.getElementById('voiceBtn').disabled = true;
        }
        
        // Animation
        let time = 0;
        let frameCount = 0;
        function animate() {
            frameCount++;
            if (frameCount <= 3) dbg('Frame ' + frameCount);
            requestAnimationFrame(animate);
            time += 0.016;
            stars.rotation.y += 0.0002;
            shelfGroup.rotation.y += 0.0005;
            controls.update();
            composer.render();
        }
        dbg('Calling animate()...');
        animate();
        dbg('animate() called');
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            composer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Initial UI update
        updateCartUI();
        if (currentUser) updateLibraryUI();
        
        console.log("🌀 Phase 4 – E‑commerce & User Library Active");
    </script>
</body>
</html>
